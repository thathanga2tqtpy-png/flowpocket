<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- App Background Icon Shape -->
  <rect width="512" height="512" rx="112" fill="url(#fpGrad)" />
  
  <!-- Wallet / Pocket Shape -->
  <g filter="url(#shadow)">
    <!-- Base Wallet Body -->
    <rect x="96" y="140" width="320" height="232" rx="36" fill="#ffffff" />
    
    <!-- Top Pocket Arc / Coin slot -->
    <path d="M 144 140 Q 256 190 368 140" stroke="#0284c7" stroke-width="8" fill="none" stroke-linecap="round" />
    
    <!-- Pocket Flap -->
    <path d="M 96 220 L 256 280 L 416 220" stroke="#e2e8f0" stroke-width="6" fill="none" />
    
    <!-- FlowPocket Symbol / Logo letters FP -->
    <text x="256" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="88" font-weight="900" fill="#0284c7" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2">
      FP
    </text>
    
    <!-- Small coin accent -->
    <circle cx="340" cy="310" r="22" fill="#f59e0b" stroke="#ffffff" stroke-width="4" />
    <text x="340" y="315" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">đ</text>
  </g>
</svg>

