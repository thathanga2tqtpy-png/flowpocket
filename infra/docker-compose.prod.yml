services:
  postgres:
    image: postgres:17
    container_name: flowpocket-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - flowpocket_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowpocket_prod_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: flowpocket-backend-prod
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-none}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flowpocket_prod_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    container_name: flowpocket-frontend-prod
    restart: always
    depends_on:
      - backend
    networks:
      - flowpocket_prod_net

  nginx:
    image: nginx:alpine
    container_name: flowpocket-nginx-prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - flowpocket_prod_net

networks:
  flowpocket_prod_net:
    name: flowpocket_production_network
    driver: bridge

volumes:
  flowpocket_prod_pgdata:
    name: flowpocket_prod_pgdata

