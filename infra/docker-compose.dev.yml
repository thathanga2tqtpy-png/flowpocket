services:
  postgres:
    image: postgres:17
    container_name: flowpocket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowpocket}
      POSTGRES_USER: ${POSTGRES_USER:-flowpocket_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowpocket_dev_pass_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flowpocket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowpocket_app} -d ${POSTGRES_DB:-flowpocket}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flowpocket_dev_net

networks:
  flowpocket_dev_net:
    name: flowpocket_dev_network
    driver: bridge

volumes:
  flowpocket_pgdata:
    name: flowpocket_flowpocket_pgdata

